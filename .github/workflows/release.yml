name: Create Github Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Draft Github Release
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "nocturne-shift ${TAG#v}" \
            --generate-notes \
            --fail-on-no-commits \
            --draft
