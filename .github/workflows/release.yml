name: Create Github Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:

  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Github Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --fail-on-no-commits
            --draft
            --generate-notes
